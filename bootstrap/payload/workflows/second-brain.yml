# [SECOND BRAIN SYSTEM] CI backstop.
#
# The committed pre-commit (.githooks/pre-commit by default) only runs on
# machines where core.hooksPath was set up by the bootstrap script -- that's
# local git config, so it isn't cloned and can be skipped entirely (missing
# bootstrap, or plain --no-verify). This workflow re-applies the same
# syntactic check to the PR diff so a missing/bypassed local hook doesn't
# mean zero enforcement. Keep the default patterns and the .second-brain.conf
# reader mirrored with the bootstrapped git pre-commit and the second-brain
# plugin's session-reminder.sh.
#
# Project-specific filters belong in the committed .second-brain.conf, not in
# this file (it is overwritten by every /second-brain:refresh). The conf is
# PARSED, never sourced: it arrives from the PR head, which on a fork PR is
# untrusted input, and sourcing it would be arbitrary code execution on the
# runner. A malicious PR can still widen the filters to dodge this check --
# treat .second-brain.conf as a review-worthy file, like the workflow itself.
name: Second Brain docs check

on:
  pull_request:

jobs:
  docs-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify docs/ or CLAUDE.md changed alongside source
        shell: bash
        run: |
          set -e
          DEFAULT_EXCLUDE_PATTERN='^(\.github/|.*\.lock$|package-lock\.json$|yarn\.lock$|pnpm-lock\.yaml$|poetry\.lock$|uv\.lock$|Cargo\.lock$|Gemfile\.lock$|\.claude/|\.githooks/|\.gitattributes$|\.second-brain\.conf$)|(^|/)tests?/'
          DOCS_PATTERN='^docs/|^CLAUDE\.md$'

          # Read KEY from the .second-brain.conf-style file $1. Last assignment
          # wins; surrounding quotes and trailing blanks are stripped; a missing
          # file or key yields the empty string (falls back to the default).
          sb_conf_get() {
            [ -f "$1" ] || return 0
            sed -n "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*//p" "$1" |
              sed -e 's/[[:space:]]*$//' -e 's/^\(['"'"'"]\)\(.*\)\1$/\2/' |
              tail -n 1
          }

          CONF=".second-brain.conf"
          INCLUDE_PATTERN="$(sb_conf_get "$CONF" SB_INCLUDE_PATTERN)"
          EXCLUDE_PATTERN="$(sb_conf_get "$CONF" SB_EXCLUDE_PATTERN)"
          EXCLUDE_EXTRA="$(sb_conf_get "$CONF" SB_EXCLUDE_EXTRA)"
          [ -n "$EXCLUDE_PATTERN" ] || EXCLUDE_PATTERN="$DEFAULT_EXCLUDE_PATTERN"
          if [ -n "$EXCLUDE_EXTRA" ]; then
            EXCLUDE_PATTERN="($EXCLUDE_PATTERN)|($EXCLUDE_EXTRA)"
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          changed_files=$(git diff --name-only "$base_sha" "$head_sha")

          if [ -z "$changed_files" ]; then
            exit 0
          fi

          relevant_files=$(printf '%s\n' "$changed_files" | grep -vE "$EXCLUDE_PATTERN" || true)
          docs_changed=$(printf '%s\n' "$relevant_files" | grep -E "$DOCS_PATTERN" || true)
          source_changed=$(printf '%s\n' "$relevant_files" | grep -vE "$DOCS_PATTERN" || true)

          if [ -n "$INCLUDE_PATTERN" ] && [ -n "$source_changed" ]; then
            source_changed=$(printf '%s\n' "$source_changed" | grep -E "$INCLUDE_PATTERN" || true)
          fi

          if [ -n "$source_changed" ] && [ -z "$docs_changed" ]; then
            echo "::error::[SECOND BRAIN SYSTEM] This PR changes source code but no file under docs/ or CLAUDE.md. Run the second-brain:update skill and push a docs update, or note in the PR description why this change doesn't need one."
            exit 1
          fi
