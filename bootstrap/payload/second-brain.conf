# [SECOND BRAIN SYSTEM] path filters.
#
# This is the ONE place to tune what counts as a "source change" -- and, via
# SB_GATE, also the one place to tune *when* the check blocks. All three
# enforcement points read it: the git pre-commit hook, the plugin's Stop-hook
# reminder, and the CI workflow.
#
# The file is create-only: `bootstrap.sh --refresh-system`
# (/second-brain:refresh) never overwrites it, so your settings survive plugin
# updates -- unlike hand-edits made directly inside the pre-commit block or the
# CI workflow, which are rewritten on every refresh.
#
# Format: KEY='value', one per line. The value is an ERE (grep -E) regex
# matched against repo-relative paths. Quotes are optional; inline comments are
# NOT supported (the whole rest of the line is the value). A key left commented
# out or set to an empty value falls back to its built-in default.
#
# All three keys below are applied to the SOURCE side only. The
# "documentation changed" set is computed first, from the raw file list, and
# is always exactly `^docs/second-brain/|^CLAUDE\.md$` -- no filter here can
# widen it or take a file out of it. That is deliberate: a filter that
# answers "is this a source change?" must not be able to decide whether the
# docs were updated (ADR 0008, amending ADR 0007).
#
# --- SB_INCLUDE_PATTERN -----------------------------------------------------
# Allowlist: only paths matching this regex count as source. Empty (the
# default) means every path counts.
#
# WARNING: an allowlist is fail-open. A directory you add to the project but
# forget to add here will never trigger the check, and the docs can drift
# silently. Prefer SB_EXCLUDE_EXTRA unless the project's source really lives in
# a fixed, rarely-changing set of directories.
#
#SB_INCLUDE_PATTERN='^(src/|lib/)'

# --- SB_EXCLUDE_EXTRA -------------------------------------------------------
# Denylist additions, OR-ed with whichever exclude pattern is in effect. This
# is the usual way to silence false positives: you keep receiving updates to
# the built-in list instead of freezing a copy of it.
#
#SB_EXCLUDE_EXTRA='^(vendor/|migrations/)|\.generated\.[a-z]+$'

# --- SB_EXCLUDE_PATTERN -----------------------------------------------------
# Replaces the built-in denylist entirely. Only needed when the built-in set is
# wrong for this project, not merely incomplete. Set it to '^$' to disable
# exclusions altogether (no path is ever empty, so nothing matches).
#
# Note the `docs/` entry: your own documentation under docs/ is neither
# documentation nor source for this check, so editing it neither trips the
# check nor satisfies it. Drop that entry if you want every doc change to
# demand a Second Brain update too.
#
# Built-in default, shown for reference / copy-paste:
#SB_EXCLUDE_PATTERN='^(\.github/|docs/|.*\.lock$|package-lock\.json$|yarn\.lock$|pnpm-lock\.yaml$|poetry\.lock$|uv\.lock$|Cargo\.lock$|Gemfile\.lock$|\.claude/|\.githooks/|\.gitattributes$|\.second-brain\.conf$)|(^|/)tests?/'
#
# NOTE: if the project uses a non-default --hooks-dir, add it here (or to
# SB_EXCLUDE_EXTRA) so installing or refreshing the system files never trips
# the check.

# --- SB_GATE ----------------------------------------------------------------
# WHERE the blocking check runs. Unlike the three keys above (which decide WHAT
# counts as a source change), this one decides WHEN the answer blocks you.
#
#   commit  (default) -- the git pre-commit hook rejects a commit that changes
#                        source without a docs/second-brain/ or CLAUDE.md
#                        change. Tightest feedback loop; one commit at a time.
#
#   push              -- the pre-commit degrades to a non-blocking notice and
#                        the git pre-push hook becomes the gate, checking the
#                        WHOLE branch (merge-base with the remote's default
#                        branch .. the pushed commit) -- the same range the CI
#                        backstop checks.
#
# Choose 'push' when work arrives as multi-commit plans: a per-commit gate then
# forces either a doc-touch or documenting an intermediate state that a later
# commit overturns. The trade-off is a looser local loop -- source can sit
# undocumented across several commits, and only the push (or CI) says so.
#
# An unrecognised value falls back to 'commit'. The Stop-hook reminder and the
# CI workflow ignore this key by design: the reminder is advisory, and CI is
# already branch-level, i.e. it is already the push-mode check.
#
#SB_GATE=commit
